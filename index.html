<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f13; --panel: #15181e; --ink: #e8ebf0; --ink-dim: #8a93a0; --line: #272c35; --chip: #1c2028; --accent: #ff8a2a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0f13; } }
:root[data-theme="dark"] { --bg: #0d0f13; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  display: flex; flex-direction: row; overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
#stage { flex: 1; min-width: 0; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
canvas { display: block; background: #08090d; touch-action: none; image-rendering: pixelated; }
#hud { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #7a8391; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
#rotate { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--ink-dim); display: none; pointer-events: none; }
#dock { width: 252px; flex: 0 0 auto; background: var(--panel); border-left: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
#hint { font-size: 11px; line-height: 14px; min-height: 28px; max-height: 28px; overflow: hidden; color: var(--ink-dim); }
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
#tabs button { border: 0; background: transparent; color: var(--ink-dim); font: inherit; font-size: 11.5px; padding: 4px 0; border-radius: 6px; cursor: pointer; white-space: nowrap; }
#tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
#elems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
.el { border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; font-size: 11.5px; padding: 0 3px 0 0; height: 29px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; min-width: 0; }
.el span { overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
.el i { width: 7px; align-self: stretch; flex: 0 0 auto; }
.el[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
#bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
#bar button { height: 26px; padding: 0; overflow: hidden; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
#bar button.on { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid #4a8cff; outline-offset: 2px; }
#toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(20,24,30,.92); color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (orientation: portrait) {
  body { flex-direction: column; }
  #dock { width: auto; border-left: 0; border-top: 1px solid var(--line); height: 50%; }
  #rotate { display: block; }
  #tabs { grid-template-columns: repeat(8, 1fr); }
  #elems { grid-template-columns: repeat(4, 1fr); }
  #bar { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="rotate">Rotate to landscape for a bigger view</div>
</div>
<div id="dock">
  <div id="hint"></div>
  <div id="tabs" role="tablist"></div>
  <div id="elems"></div>
  <div id="bar">
    <button id="bSize">Brush 3</button>
    <button id="bShape">Free</button>
    <button id="bUndo">Undo</button>
    <button id="bView">View</button>
    <button id="bGrav">Gravity</button>
    <button id="bSpeed">Speed 1×</button>
    <button id="bPause">Pause</button>
    <button id="bStep">Step</button>
    <button id="bDemo">Demo</button>
    <button id="bSave">Save</button>
    <button id="bLoad">Load</button>
    <button id="bClear">Clear</button>
    <button id="bMirror">Mirror</button>
    <button id="bGasX">No Smoke</button>
    <button id="bAirX">Reset Air</button>
    <button id="bTempX">Reset ℃</button>
  </div>
</div>
<script id="core">
// ============ 물리 샌드박스 엔진 (DOM 없음) ============
// 고체: 강체(자세·질량·관성, 겉면 사각 픽셀 충돌, 야코비 보정, 수면, 충격·압력 파괴)
// 가루: 마찰 있는 알갱이 / 액체: 이중 밀도 완화 입자 유체 / 기체·불: 공기에 실려 다니는 입자

const CAT = { SOLID: 0, POWDER: 1, LIQUID: 2, GAS: 3 };
const E = {};
const ELEMENTS = [];
function def(key, o) { o.key = key; o.id = ELEMENTS.length; ELEMENTS.push(o); E[key] = o.id; }
// 공통: cat, rgb, dens, fr(마찰), str(충격 견딤), pstr(압력 견딤), cond(열전도 0~1), t0(처음 온도)
// 상태 변화: hi = {t, to} 이상이면 바뀜, lo = {t, to} 이하이면 바뀜 / 가연성: ignite, burn / 폭발: boom, bp, bv, sens
// 공기: kp(바람 따라가기), grav(프레임당 중력, 기체는 음수), hotair
const UNBREAK = 1e9;
const PW = { adv: 1, kp: 0.06 }, LQ = { adv: 1, kp: 0.03 }, GS = { adv: 1, kp: 0.4 };

def('WALL', { name: 'Wall', cat: CAT.SOLID, rgb: [128, 128, 138], dens: 50, fr: 0.8, str: UNBREAK, pstr: UNBREAK, cond: 0.0, fixed: true, hint: 'Never moves and never breaks.' });
def('IRON', { name: 'Iron', cat: CAT.SOLID, rgb: [150, 158, 168], dens: 7.8, fr: 0.45, str: 14, pstr: 200, cond: 0.9, hi: { t: 1538, to: 'LAVA' }, hint: 'Strong and conducts heat well. Melts at 1538℃.' });
def('METL', { name: 'Metal', cat: CAT.SOLID, rgb: [112, 118, 140], dens: 7.0, fr: 0.45, str: 13, pstr: 180, cond: 0.95, hi: { t: 1400, to: 'LAVA' }, hint: 'Conducts heat very well. Melts at 1400℃.' });
def('GOLD', { name: 'Gold', cat: CAT.SOLID, rgb: [220, 180, 60], dens: 19.3, fr: 0.4, str: 11, pstr: 160, cond: 0.95, hi: { t: 1064, to: 'LAVA' }, hint: 'Very heavy. Melts at 1064℃.' });

def('GLAS', { clear: 0.45, name: 'Glass', cat: CAT.SOLID, rgb: [170, 215, 228], dens: 2.5, fr: 0.25, str: 3.2, pstr: 18, cond: 0.35, hi: { t: 1400, to: 'LAVA' }, hint: 'Shatters from impact or pressure. Melts at 1400℃.' });
def('STON', { name: 'Stone', cat: CAT.SOLID, rgb: [122, 118, 110], dens: 2.6, fr: 0.75, str: 4.5, pstr: 60, cond: 0.3, hi: { t: 1000, to: 'LAVA' }, hint: 'Crumbles where it cracks. Turns to lava at 1000℃.' });

def('DUST', { flam: 0.35, ...PW, kp: 0.15, name: 'Dust', cat: CAT.POWDER, rgb: [150, 120, 90], dens: 1.2, fr: 0.8, cond: 0.1, ignite: 350, burn: 30, hint: 'Light, drifts around and catches fire.' });
def('GRVL', { ...PW, kp: 0.03, name: 'Gravel', cat: CAT.POWDER, rgb: [110, 108, 104], dens: 2.7, fr: 0.9, cond: 0.3, hi: { t: 1000, to: 'LAVA' }, hint: 'Heavy grains.' });
def('SAWD', { flam: 0.3, ...PW, kp: 0.12, name: 'Sawdust', cat: CAT.POWDER, rgb: [214, 178, 128], dens: 0.4, fr: 0.8, cond: 0.1, ignite: 230, burn: 70, hint: 'Light, floats on water and burns fast.' });
def('ASH', { ...PW, kp: 0.2, name: 'Ash', cat: CAT.POWDER, rgb: [96, 94, 92], dens: 0.35, fr: 0.7, cond: 0.1, hint: 'Very light. Blown away by wind.' });

// ---- 액체 ----
def('WATR', { ...LQ, name: 'Water', cat: CAT.LIQUID, rgb: [38, 110, 255], dens: 1.0, visc: 0.4, alpha: 0.72, cond: 0.11, lo: { t: -2, to: 'ICE' }, boil: 100, hint: 'Puts out fire. Boils at 100℃, freezes at 0℃.' });

def('LN2', { ...LQ, name: 'Liquid N2', cat: CAT.LIQUID, rgb: [200, 225, 255], dens: 0.8, visc: 0.2, alpha: 0.55, cond: 0.27, t0: -200, boil: -196, hint: '-196℃. Freezes what it touches.' });
def('MERC', { ...LQ, kp: 0.01, name: 'Mercury', cat: CAT.LIQUID, rgb: [185, 190, 200], dens: 13.5, visc: 0.5, alpha: 0.98, cond: 0.6, hint: 'So heavy that even iron floats on it.' });

def('FIRE', { ...GS, kp: 0.5, name: 'Fire', cat: CAT.GAS, rgb: [255, 140, 30], dens: 0.1, grav: -0.06, hotair: 0.004, t0: 900, hint: 'Heats its surroundings and spreads flames.' });
def('PLSM', { ...GS, kp: 0.5, name: 'Plasma', cat: CAT.GAS, rgb: [220, 160, 255], dens: 0.1, grav: -0.03, hotair: 0.01, t0: 6000, hint: 'An extremely hot gas.' });
def('GAS', { ...GS, kp: 0.3, name: 'Gas', cat: CAT.GAS, rgb: [200, 200, 120], dens: 0.1, grav: -0.01, ignite: 400, boom: 0.3, bp: 1.5, bv: 0.2, hint: 'Flashes and explodes when it meets fire.' });
def('SMKE', { ...GS, kp: 0.35, name: 'Smoke', cat: CAT.GAS, rgb: [110, 110, 116], dens: 0.1, grav: -0.05, hint: 'Left over from burning.' });
def('STEM', { ...GS, kp: 0.3, name: 'Steam', cat: CAT.GAS, rgb: [215, 225, 240], dens: 0.1, grav: -0.08, t0: 110, hint: 'Turns back into water below 100℃.' });
def('NGAS', { ...GS, kp: 0.3, name: 'Nitrogen', cat: CAT.GAS, rgb: [190, 215, 255], dens: 0.1, grav: 0.01, t0: -190, hint: 'Cold gas from boiling liquid nitrogen.' });

def('PLST', { name: 'Plastic', cat: CAT.SOLID, rgb: [230, 230, 220], dens: 0.95, fr: 0.5, str: 8, pstr: 60, cond: 0.05, hi: { t: 160, to: 'MPLS' }, hint: 'Light. Melts and flows at 160℃.' });

def('WAX', { name: 'Wax', cat: CAT.SOLID, rgb: [240, 225, 170], dens: 0.9, fr: 0.6, str: 5, pstr: 40, cond: 0.1, hi: { t: 60, to: 'MWAX' }, hint: 'Melts at 60℃ and hardens again when cooled.' });

def('CLNE', { name: 'Clone', cat: CAT.SOLID, rgb: [230, 210, 40], dens: 50, fr: 0.8, str: UNBREAK, pstr: UNBREAK, cond: 0, fixed: true, clone: true, hint: 'Keeps producing the first thing it touches.' });
def('VOID', { name: 'Void', cat: CAT.SOLID, rgb: [30, 10, 40], dens: 50, fr: 0.8, str: UNBREAK, pstr: UNBREAK, cond: 0, fixed: true, voidp: true, hint: 'Deletes everything it touches.' });

def('IRNP', { ...PW, kp: 0.03, name: 'Iron Dust', cat: CAT.POWDER, rgb: [90, 94, 104], dens: 7.0, fr: 0.7, cond: 0.6, hi: { t: 1538, to: 'LAVA', ct: 'IRON' }, hint: 'Melts into iron. Rusts slowly in water.' });
def('RUST', { ...PW, kp: 0.05, name: 'Rust', cat: CAT.POWDER, rgb: [150, 70, 40], dens: 5.2, fr: 0.8, cond: 0.2, hint: 'Iron dust that rusted in water.' });

def('HONY', { ...LQ, name: 'Honey', cat: CAT.LIQUID, rgb: [240, 170, 30], dens: 1.4, visc: 30, alpha: 0.9, cond: 0.1, hint: 'Flows very slowly and stickily.' });
def('ETHL', { ...LQ, name: 'Alcohol', cat: CAT.LIQUID, rgb: [200, 220, 240], dens: 0.79, visc: 0.3, alpha: 0.45, cond: 0.12, ignite: 200, burn: 50, flam: 0.4, boil: 78, boilTo: 'GAS', hint: 'Catches fire easily. Evaporates at 78℃.' });

	let ITERS = 8;
	const H_F = 2.0, RHO0 = 1.5, KP = 0.35, KN = 0.35;
	const PF = 0.22; // 압력 → 힘

	function rnd() { return Math.random(); }
	function aIdx(px, py) {

	// 물질이 바뀜 (녹음·얼음·끓음·연소 등). 강체에 속해 있으면 떨어져 나옴

	// 굳은 입자(용암→돌, 물→얼음 등)를 이웃끼리 묶어 새 강체로

		const list = [];

			if (frame - freshAt[i] < 40) continue;

		}
		if (!list.length) return;

					if (j === undefined || seen.has(j) || el[j] !== el[a]) continue;
					seen.add(j); st.push(j);

			let host = null;

					if (qx < 0 || qy < 0 || qx >= W || qy >= H) continue;
					const j = occ[qy * W + qx] - 1;
					if (j < 0 || body[j] < 0 || el[j] !== el[a]) continue;
					const B = bodies[body[j]];
					if (B.cast && Math.abs(Math.sin(B.th)) < 0.03 && Math.hypot(B.vx, B.vy) < 0.3) { host = B; break; }
				}
				if (host) break;
			}
			if (host) {
				const bid = bodies.indexOf(host);
				for (const a of comp) { gx[a] = Math.round(x[a] - host.cx + host.gcx); gy[a] = Math.round(y[a] - host.cy + host.gcy); fresh[a] = 0; }

				if (ok) {

					if (nb2 >= 0) bodies[nb2].cast = true;

				}
			}
			if (comp.length >= 2) { for (const i of comp) fresh[i] = 0; const nb2 = makeBody(comp, false, comp.map(i => vx[i]), comp.map(i => vy[i]), 0); if (nb2 >= 0) bodies[nb2].cast = true; }

	}
	const detachNow = [];

	// ---------------- 한 프레임 ----------------

		applyGrab();

		for (const B of bodies) if (B.alive && !B.stat && !B.asleep) dynB.push(B);
		// 공기 힘 (바디: 겉면 입자마다 압력 기울기 + 바람 끌림)
		for (const B of bodies) {

					const i = B.m[k]; if (!boundary[i]) continue;
					const ap = Math.abs(pv[aIdx(x[i], y[i])]) / ELEMENTS[el[i]].pstr;
					if (ap > pmax) { pmax = ap; pmaxI = i; }
				}

				const ax = -AIR.gx * PF + (AIR.vx - B.vx) * 0.03, ay = -AIR.gy * PF + (AIR.vy - B.vy) * 0.03;
				fx += ax; fy += ay; tq += (P0[0] - B.cx) * ay - (P0[1] - B.cy) * ax;

		acnt.fill(0); asvx.fill(0); asvy.fill(0);
		for (let i = 0; i < n; i++) {
			if (dead[i] || body[i] >= 0 || anch[i]) continue;

			if (!D.adv) continue;
			if (zz[i]) {
				if ((i + frame) % 4) continue;
				airAt(x[i], y[i], AIR);
				if (Math.abs(AIR.vx) + Math.abs(AIR.vy) > 0.5 || (Math.abs(AIR.gx) + Math.abs(AIR.gy)) * PF / D.dens > 0.02) { zz[i] = 0; calm[i] = 0; } else continue;
			}
			airAt(x[i], y[i], AIR);
			const kp = D.kp;
			vx[i] += (AIR.vx - vx[i]) * kp;

				}

				const c = cat[i];

	}

	function fractures() {
		let budget = 4;
		const nb = bodies.length;
		for (let b = 0; b < nb && budget > 0; b++) {
			const B = bodies[b];
			if (!B.alive) continue;

					const pr = PV[a0] * w00 + PV[a0 + 1] * w10 + PV[a0 + AW] * w01 + PV[a0 + AW + 1] * w11;
					const vxv = VX[a0] * w00 + VX[a0 + 1] * w10 + VX[a0 + AW] * w01 + VX[a0 + AW + 1] * w11;
					const vyv = VY[a0] * w00 + VY[a0 + 1] * w10 + VY[a0 + AW] * w01 + VY[a0 + AW + 1] * w11;
					const r = Math.max(0, Math.min(1, pr / 6)), bl = Math.max(0, Math.min(1, -pr / 6));
					const g = Math.min(1, Math.hypot(vxv, vyv) / 10) * 0.8;
					const m = Math.max(r, bl, g);
					if (m < 0.02) continue;
					const q = yy * BW + xx, u = buf[q], keep = 1 - m * 0.4;
					buf[q] = pack(Math.min(255, (u & 255) * keep + r * 235) | 0, Math.min(255, ((u >> 8) & 255) * keep + g * 150) | 0, Math.min(255, ((u >> 16) & 255) * keep + bl * 245) | 0);
				}
			}
		}
		return buf;
	}
	return { render, buf, BW, BH };
}



// ============ 시뮬레이션 호스트: 워커 안(또는 메인 스레드)에서 월드를 돌리고 그림 ============
function startHost(canvas, post) {
	const W = 320, H = 180;
	const world = createWorld(W, H, 16000);
	const S = 2;
	const rend = createRenderer(world, S);
	const off = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(rend.BW, rend.BH) : Object.assign(document.createElement('canvas'), { width: rend.BW, height: rend.BH });
	const octx = off.getContext('2d');
	const img = octx.createImageData(rend.BW, rend.BH);
	const img32 = new Uint32Array(img.data.buffer);
	const ctx = canvas.getContext('2d');
	const toast = msg => post({ t: 'toast', msg });

	// ---- 상태 ----
	let cur = 'IRON', size = 3, shape = 0; // 0 자유, 1 선, 2 사각형, 3 원
	let paused = false, view = 0, speed = 1, stepOnce = false;
	let down = false, lastC = null, startC = null, ptr = null, hover = null, pending = null;
	const undo = [];
	const TOOLK = { GRAB: 1, ERAS: 1, ANCH: 1, HEAT: 1, COOL: 1, WIND: 1, PICK: 1, IGNT: 1, PULL: 1, PUSH: 1 };
	let mirror = false; // 좌우 대칭 그리기
	const occ = new Uint8Array(W * H);
	function isSolid(k) { return !TOOLK[k] && ELEMENTS[E[k]].cat === CAT.SOLID; }
	function pushUndo() { try { undo.push(world.snapshot()); if (undo.length > 8) undo.shift(); } catch (e) { } }

	// ---- 붓 ----
	function brushCells(c, into) {
		const r = size - 0.5, cx = Math.floor(c.x), cy = Math.floor(c.y), R = Math.ceil(r);
		for (let yy = cy - R; yy <= cy + R; yy++) for (let xx = cx - R; xx <= cx + R; xx++) {
			if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
			if ((xx - cx) ** 2 + (yy - cy) ** 2 <= r * r + 0.3) { into.add(yy * W + xx); if (mirror) into.add(yy * W + (W - 1 - xx)); }
		}
	}
	const mir = c => ({ x: W - c.x, y: c.y });
	function both(c, fn) { fn(c); if (mirror) fn(mir(c)); }
	function lineTo(a, b, fn) { const d = Math.hypot(b.x - a.x, b.y - a.y), st = Math.max(1, Math.ceil(d / 0.5)); for (let k = 0; k <= st; k++) fn({ x: a.x + (b.x - a.x) * k / st, y: a.y + (b.y - a.y) * k / st }); }
	function shapeCells(a, b) {
		const set = new Set();
		if (shape === 1) lineTo(a, b, p => brushCells(p, set));
		else if (shape === 2) {
			const x0 = Math.max(0, Math.floor(Math.min(a.x, b.x))), x1 = Math.min(W - 1, Math.floor(Math.max(a.x, b.x)));
			const y0 = Math.max(0, Math.floor(Math.min(a.y, b.y))), y1 = Math.min(H - 1, Math.floor(Math.max(a.y, b.y)));
			for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { set.add(y * W + x); if (mirror) set.add(y * W + W - 1 - x); }
		} else if (shape === 3) {
			const r = Math.max(0.6, Math.hypot(b.x - a.x, b.y - a.y)), cx = a.x, cy = a.y;
			for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(H - 1, Math.ceil(cy + r)); y++)
				for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.ceil(cx + r)); x++)
					if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) { set.add(y * W + x); if (mirror) set.add(y * W + W - 1 - x); }
		}
		return set;
	}
	function refreshOcc() {
		occ.fill(0);
		for (let i = 0; i < world.n; i++) { if (world.dead[i] || world.cat[i] === CAT.GAS) continue; const qx = world.x[i] | 0, qy = world.y[i] | 0; if (qx >= 0 && qy >= 0 && qx < W && qy < H) occ[qy * W + qx] = 1; }
	}
	function fillCells(set, e, prob) {
		refreshOcc();
		const c = ELEMENTS[e].cat;
		for (const k of set) {
			if ((c !== CAT.GAS && occ[k]) || Math.random() > prob) continue;
			const i = world.add(k % W + 0.3 + Math.random() * 0.4, ((k / W) | 0) + 0.3 + Math.random() * 0.4, e);
			if (i < 0) { toast('Particle limit reached'); break; }
			occ[k] = 1;
		}
	}
	function spawnFlow() {
		if (!down || !ptr) return;
		if (cur === 'HEAT' || cur === 'COOL') { both(ptr, p => world.heat(p.x, p.y, size + 0.5, cur === 'HEAT' ? 25 : -25)); return; }
		if (cur === 'IGNT') { both(ptr, p => world.ignite(p.x, p.y, size + 0.5)); return; }
		if (cur === 'PULL' || cur === 'PUSH') { both(ptr, p => world.pull(p.x, p.y, size * 2 + 6, cur === 'PULL' ? 1.2 : -1.2)); return; }
		if (TOOLK[cur] || isSolid(cur) || shape) return;
		const e = E[cur], c = ELEMENTS[e].cat;
		const set = new Set(); brushCells(ptr, set);
		fillCells(set, e, c === CAT.GAS ? 0.35 : c === CAT.LIQUID ? 0.5 : 0.3);
	}

	// ---- 입력 ----
	function onDown(c) {
		down = true; lastC = startC = ptr = c;
		if (cur === 'PICK') { const k = world.pick(c.x, c.y); if (k) { cur = k; post({ t: 'picked', key: k }); } return; }
		if (!TOOLK[cur] || cur === 'ERAS' || cur === 'ANCH') pushUndo();
		if (isSolid(cur)) { pending = new Set(); if (!shape) brushCells(c, pending); }
		else if (cur === 'ANCH') { const r = world.toggleAnchor(c.x, c.y); toast(r === true ? 'Pinned' : r === false ? 'Unpinned' : 'Tap a solid or powder'); }
		else if (cur === 'ERAS') both(c, p => world.erase(p.x, p.y, size + 0.5));
		else if (cur === 'GRAB') { const r = world.grab(c.x, c.y); if (r === 'fixed') toast('Pinned objects cannot be grabbed'); }
	}
	function onMove(c) {
		hover = c;
		if (!down) return;
		ptr = c;
		if (pending && !shape) lineTo(lastC, c, p => brushCells(p, pending));
		else if (pending && shape) pending = shapeCells(startC, c);
		else if (cur === 'ERAS') { lineTo(lastC, c, p => world.erase(p.x, p.y, size + 0.5)); if (mirror) lineTo(mir(lastC), mir(c), p => world.erase(p.x, p.y, size + 0.5)); }
		else if (cur === 'GRAB') world.dragTo(c.x, c.y);
		else if (cur === 'WIND') { world.wind(c.x, c.y, c.x - lastC.x, c.y - lastC.y, size + 2); if (mirror) world.wind(W - c.x, c.y, lastC.x - c.x, c.y - lastC.y, size + 2); }
		lastC = c;
	}
	function onUp() {
		if (!down) return;
		down = false; world.release();
		if (pending && pending.size) { refreshOcc(); world.addStroke(pending, E[cur], occ); }
		else if (shape && !TOOLK[cur] && !isSolid(cur) && startC && lastC) {
			const e = E[cur];
			fillCells(shapeCells(startC, lastC), e, ELEMENTS[e].cat === CAT.GAS ? 0.5 : 0.9);
		}
		pending = null;
	}

	// ---- 예시 장면 ----
	function rect(x0, y0, w, h) { const s = new Set(); for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) if (x >= 0 && y >= 0 && x < W && y < H) s.add(y * W + x); return s; }
	function demo() {
		world.addStroke(rect(8, 70, 90, 3), E.WALL);
		world.addStroke(rect(14, 58, 12, 12), E.WOOD);
		world.addStroke(rect(40, 50, 3, 20), E.GLAS);
		world.addStroke(rect(58, 62, 8, 8), E.IRON);
		world.addStroke(rect(76, 62, 8, 8), E.RUBR);
		world.addStroke(rect(128, 140, 5, 40), E.STON);
		world.addStroke(rect(138, 168, 11, 12), E.C4);
		world.addStroke(rect(154, 146, 5, 34), E.STON);
		for (let x = 4; x < 138; x++) for (let k = 0; k < 2; k++) world.add(x + 0.5, H - 0.5 - k, E.GUNP);
		for (let k = 0; k < 300; k++) world.add(24 + Math.random() * 50, H - 3 - Math.random() * 8, E.SAWD);
		for (let k = 0; k < 40; k++) world.add(100 + Math.random() * 8, H - 3 - Math.random() * 5, E.FWRK);
		for (let y = 150; y < 176; y++) for (let x = 170; x < 185; x++) if ((x + y) % 2 === 0) world.add(x + 0.5, y + 0.5, E.GLOW);
		world.addStroke(rect(200, 60, 3, 22), E.WALL); world.addStroke(rect(200, 80, 60, 3), E.WALL); world.addStroke(rect(257, 60, 3, 22), E.WALL);
		for (let y = 66; y < 80; y++) for (let x = 204; x < 232; x++) world.add(x + 0.5, y + 0.5, E.LAVA);
		world.addStroke(rect(238, 66, 16, 14), E.ICE);
		world.addStroke(rect(196, 138, 3, 42), E.WALL);
		for (let y = 150; y < H; y++) for (let x = 199; x < W; x++) world.add(x + 0.5 + (y % 2) * 0.25, y + 0.5, y < 153 ? E.OIL : E.WATR);
		world.addStroke(rect(220, 144, 22, 3), E.WOOD);
		world.addStroke(rect(280, 132, 8, 8), E.IRON);
		world.addStroke(rect(110, 20, 60, 3), E.CLNE);
		toast('Use Ignite in the Tools tab on the gunpowder at bottom left');
	}
	demo();

	// ---- 명령 ----
	function command(m) {
		switch (m.name) {
			case 'state': cur = m.cur; size = m.size; shape = m.shape; break;
			case 'pause': paused = m.on; break;
			case 'step': stepOnce = true; break;
			case 'speed': speed = m.v; break;
			case 'view': view = m.v; break;
			case 'gravity': world.gravity = m.v; toast(m.v ? (m.v === 1 ? 'Normal gravity' : 'Low gravity') : 'Zero gravity'); break;
			case 'undo': if (undo.length) { world.restore(undo.pop()); toast('Undone'); } else toast('Nothing to undo'); break;
			case 'clear': pushUndo(); world.clear(); toast('Cleared everything'); break;
			case 'demo': pushUndo(); world.clear(); demo(); break;
			case 'save': try { post({ t: 'saved', data: world.serialize() }); } catch (e) { toast('Could not save'); } break;
			case 'load': try { pushUndo(); if (world.deserialize(m.data)) toast('Loaded'); else toast('Could not load'); } catch (e) { toast('Could not load'); } break;
			case 'resize': canvas.width = m.w; canvas.height = m.h; break;
			case 'mirror': mirror = m.on; toast(m.on ? 'Mirror drawing on' : 'Mirror drawing off'); break;
			case 'clearGas': world.clearGas(); toast('Removed smoke and gases'); break;
			case 'resetAir': world.resetAir(); toast('Reset pressure, wind and air temperature'); break;
			case 'resetTemp': pushUndo(); world.resetTemp(); toast('Reset all temperatures and put out fires'); break;
		}
	}
	function onMessage(m) {
		if (m.t === 'down') onDown(m); else if (m.t === 'move') onMove(m); else if (m.t === 'up') onUp();
		else if (m.t === 'hover') hover = m; else if (m.t === 'cmd') command(m);
	}

	// ---- 루프 ----
	let last = 0, frames = 0, fpsT = 0, costAvg = 6, shake = 0, lastFlash = 0, stepAcc = 0;
	const raf = typeof requestAnimationFrame !== 'undefined' ? requestAnimationFrame : (f => setTimeout(() => f(performance.now()), 16));
	function loop(now) {
		spawnFlow();
		if (!paused || stepOnce) {
			stepAcc += stepOnce ? 1 : speed;
			stepOnce = false;
			const t0 = performance.now();
			while (stepAcc >= 1) { world.step(); stepAcc -= 1; }
			const cost = performance.now() - t0;
			costAvg = costAvg * 0.95 + cost / Math.max(1, speed) * 0.05;
			if (costAvg > 24 && world.iters > 4) world.iters = world.iters - 1;
			else if (costAvg < 11 && world.iters < 8) world.iters = world.iters + 1;
		}
		// 큰 폭발은 화면을 흔듦
		for (const f of world.flash) if (f.t === 1 && f.r > 6) shake = Math.min(6, shake + f.r * 0.12);
		img32.set(rend.render(now, view));
		if (pending) {
			const d = ELEMENTS[E[cur]];
			const col = (255 << 24) | (((d.rgb[2] * 0.55) | 0) << 16) | (((d.rgb[1] * 0.55) | 0) << 8) | ((d.rgb[0] * 0.55) | 0);
			for (const k of pending) { const cx = k % W, cy = (k / W) | 0; for (let yy = cy * S; yy < cy * S + S; yy++) for (let xx = cx * S; xx < cx * S + S; xx++) img32[yy * rend.BW + xx] = col; }
		}
		octx.putImageData(img, 0, 0);
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.fillStyle = '#08090d'; ctx.fillRect(0, 0, canvas.width, canvas.height);
		const sx = shake ? (Math.random() - 0.5) * shake * canvas.width / W * 0.5 : 0, sy = shake ? (Math.random() - 0.5) * shake * canvas.height / H * 0.5 : 0;
		shake *= 0.85; if (shake < 0.1) shake = 0;
		ctx.imageSmoothingEnabled = false;
		ctx.drawImage(off, sx, sy, canvas.width, canvas.height);
		const sc = canvas.width / W;
		// 고정점, 도형 미리보기, 붓 테두리
		ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, sc * 0.3);
		for (let i = 0; i < world.n; i++) if (world.anch[i] && !ELEMENTS[world.el[i]].fixed) { ctx.beginPath(); ctx.arc(world.x[i] * sc, world.y[i] * sc, sc * 1.1, 0, Math.PI * 2); ctx.stroke(); }
		if (down && shape && startC && lastC && !TOOLK[cur] && !isSolid(cur)) {
			ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.setLineDash([sc * 2, sc * 2]);
			if (shape === 1) { ctx.beginPath(); ctx.moveTo(startC.x * sc, startC.y * sc); ctx.lineTo(lastC.x * sc, lastC.y * sc); ctx.stroke(); }
			else if (shape === 3) { ctx.beginPath(); ctx.arc(startC.x * sc, startC.y * sc, Math.hypot(lastC.x - startC.x, lastC.y - startC.y) * sc, 0, Math.PI * 2); ctx.stroke(); }
			else ctx.strokeRect(Math.min(startC.x, lastC.x) * sc, Math.min(startC.y, lastC.y) * sc, Math.abs(lastC.x - startC.x) * sc, Math.abs(lastC.y - startC.y) * sc);
			ctx.setLineDash([]);
		}
		if (mirror) { ctx.strokeStyle = 'rgba(120,200,255,.25)'; ctx.lineWidth = 1; ctx.setLineDash([sc * 3, sc * 3]); ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke(); ctx.setLineDash([]); }
		const hp = down ? ptr : hover;
		if (hp && cur !== 'PICK') { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(hp.x * sc, hp.y * sc, (size + 0.5) * sc, 0, Math.PI * 2); ctx.stroke(); }
		frames++;
		if (now - fpsT > 400) {
			const fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now;
			let info = '';
			if (hp) { const pr = world.probe(hp.x, hp.y); info = ` · ${pr.name} ${Math.round(pr.temp)}℃ · pressure ${pr.p.toFixed(1)}`; }
			post({ t: 'hud', text: `${fps} fps · particles ${world.n}${info}` });
		}
		raf(loop);
	}
	raf(loop);
	return onMessage;
}

<script>
(() => {
const cv = document.getElementById('cv'), stage = document.getElementById('stage');
const hud = document.getElementById('hud'), hint = document.getElementById('hint'), toastEl = document.getElementById('toast');
const W = 320, H = 180;

// ---- 시뮬레이션 연결: 가능하면 별도 스레드(워커), 안 되면 메인 스레드 ----
let send = () => {}, mode = '';
function onHostMsg(m) {
  if (m.t === 'toast') toast(m.msg);
  else if (m.t === 'hud') hud.textContent = m.text + (mode ? ' · ' + mode : '');
  else if (m.t === 'picked') { selectKey(m.key); toast(info(m.key).name + ' selected'); }
  else if (m.t === 'saved') { try { localStorage.setItem('physbox-save', m.data); toast('Saved'); } catch (e) { toast('Not enough storage'); } }
}
function startMain() {
  mode = '';
  const handler = startHost(cv, onHostMsg);
  send = m => handler(m);
  afterStart();
}
function startWorker() {
  let worker;
  try {
    const src = document.getElementById('core').textContent + `
      let handler = null;
      onmessage = e => { const m = e.data; if (m.t === 'init') handler = startHost(m.canvas, x => postMessage(x)); else if (m.t === 'ping') postMessage({ t: 'pong' }); else if (handler) handler(m); };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) { startMain(); return; }
  let ok = false;
  const timer = setTimeout(() => { if (!ok) { try { worker.terminate(); } catch (e) {} startMain(); } }, 800);
  worker.onerror = () => { if (!ok) { clearTimeout(timer); try { worker.terminate(); } catch (e) {} startMain(); } };
  worker.onmessage = e => {
    if (e.data.t === 'pong' && !ok) {
      ok = true; clearTimeout(timer);
      const offc = cv.transferControlToOffscreen();
      worker.postMessage({ t: 'init', canvas: offc }, [offc]);
      worker.onmessage = ev => onHostMsg(ev.data);
      send = m => worker.postMessage(m);
      mode = 'worker thread';
      afterStart();
      return;
    }
  };
  worker.postMessage({ t: 'ping' });
}

// ---- 화면 크기 ----
let cssW = 0, cssH = 0;
function fit() {
  const r = stage.getBoundingClientRect();
  const sc = Math.min(r.width / W, r.height / H);
  cssW = W * sc; cssH = H * sc;
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  send({ t: 'cmd', name: 'resize', w: Math.round(cssW * devicePixelRatio), h: Math.round(cssH * devicePixelRatio) });
}
function afterStart() { fit(); sendState(); }
new ResizeObserver(() => fit()).observe(stage);

// ---- 탭·물질 ----
const TABS = [
  { id: 'recent', label: 'Recent', items: [] },
  { id: 'solid', label: 'Solid', items: ['WALL', 'IRON', 'METL', 'GOLD', 'TUNG', 'WOOD', 'COAL', 'GLAS', 'STON', 'BRCK', 'OBSD', 'ICE', 'DMND', 'PLST', 'RUBR', 'WAX', 'COPR', 'SPNG'] },
  { id: 'powder', label: 'Powder', items: ['SAND', 'DIRT', 'DUST', 'GRVL', 'SAWD', 'ASH', 'SALT', 'SNOW', 'CNCT', 'IRNP', 'RUST', 'NA', 'URAN'] },
  { id: 'liquid', label: 'Liquid', items: ['WATR', 'SLTW', 'OIL', 'LAVA', 'ACID', 'LN2', 'MERC', 'HONY', 'ETHL', 'SLIM', 'MUD', 'NAPM', 'GLOW', 'GASO'] },
  { id: 'gas', label: 'Gas/Fire', items: ['FIRE', 'PLSM', 'GAS', 'HYGN', 'OXYG', 'CO2', 'SMKE', 'STEM'] },
  { id: 'boom', label: 'Explosive', items: ['C4', 'GUNP', 'NITR', 'THRM', 'FUSE', 'FWRK', 'SMKB'] },
  { id: 'special', label: 'Special', items: ['CLNE', 'VOID', 'PLNT', 'SEED', 'HTPL', 'CLPL'] },
  { id: 'tool', label: 'Tools', items: ['GRAB', 'IGNT', 'ERAS', 'ANCH', 'HEAT', 'COOL', 'WIND', 'PULL', 'PUSH', 'PICK'] },
];
const TOOLS = {
  IGNT: { name: 'Ignite', rgb: [255, 150, 40], hint: 'Sets things on fire. Explosives go off right away.' },
  PULL: { name: 'Suck', rgb: [150, 120, 255], hint: 'Sucks air in, pulling powder, liquid and smoke toward your finger.' },
  PUSH: { name: 'Blow', rgb: [255, 200, 120], hint: 'Blasts air outward, blowing everything away.' },
  GRAB: { name: 'Grab', rgb: [120, 200, 255], hint: 'Grab, drag and throw solid objects. Stirs powder and liquid.' },
  ERAS: { name: 'Eraser', rgb: [90, 90, 96], hint: 'Rub to erase. Solid objects re-join from what is left.' },
  ANCH: { name: 'Pin', rgb: [230, 230, 230], hint: 'Tap an object to pin it in place. Tap again to unpin.' },
  HEAT: { name: 'Heat', rgb: [255, 90, 40], hint: 'Hold to heat up. Melts, boils and ignites.' },
  COOL: { name: 'Cool', rgb: [80, 160, 255], hint: 'Hold to cool down. Freezes water and puts out fire.' },
  WIND: { name: 'Wind', rgb: [170, 240, 200], hint: 'Makes wind in the direction you swipe.' },
  PICK: { name: 'Picker', rgb: [250, 250, 250], hint: 'Tap something on screen to select that material.' },
};
function info(k) { return TOOLS[k] || ELEMENTS[E[k]]; }
let curTab = 'solid', cur = 'IRON';
const RECENT = TABS[0].items;
function useKey(k) { const i = RECENT.indexOf(k); if (i >= 0) RECENT.splice(i, 1); RECENT.unshift(k); if (RECENT.length > 15) RECENT.pop(); }
const sizes = [1, 2, 3, 5, 8, 12]; let sizeIdx = 2, shape = 0;
const tabs = document.getElementById('tabs'), elems = document.getElementById('elems');
TABS.forEach(t => {
  const b = document.createElement('button'); b.textContent = t.label; b.setAttribute('role', 'tab'); b.dataset.tab = t.id;
  b.onclick = () => { curTab = t.id; if (t.items.length && !t.items.includes(cur)) cur = t.items[0]; renderUI(); sendState(); };
  tabs.appendChild(b);
});
function renderUI() {
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === curTab));
  elems.innerHTML = '';
  const list = TABS.find(t => t.id === curTab).items;
  if (!list.length) { const p = document.createElement('div'); p.style.cssText = 'grid-column:1/-1;font-size:11px;color:var(--ink-dim);padding:6px 2px'; p.textContent = 'Materials and tools you use show up here.'; elems.appendChild(p); }
  for (const k of list) {
    const d = info(k);
    const b = document.createElement('button'); b.className = 'el';
    b.innerHTML = `<i style="background:rgb(${d.rgb.join(',')})"></i><span>${d.name}</span>`;
    b.setAttribute('aria-pressed', cur === k);
    b.onclick = () => { cur = k; if (curTab !== 'recent') useKey(k); renderUI(); sendState(); };
    elems.appendChild(b);
  }
  hint.textContent = info(cur).hint || '';
}
function selectKey(k) { useKey(k); if (curTab !== 'recent') { const t = TABS.find(t => t.id !== 'recent' && t.items.includes(k)); if (t) curTab = t.id; } cur = k; renderUI(); sendState(); }
function sendState() { send({ t: 'cmd', name: 'state', cur, size: sizes[sizeIdx], shape }); }
renderUI();

let toastT = 0;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1700); }

// ---- 아래 버튼 ----
const $ = id => document.getElementById(id);
function setSize(i) { sizeIdx = Math.max(0, Math.min(sizes.length - 1, i)); $('bSize').textContent = 'Brush ' + sizes[sizeIdx]; sendState(); }
$('bSize').onclick = () => setSize((sizeIdx + 1) % sizes.length);
window.brushDelta = d => { setSize(sizeIdx + d); toast('Brush size ' + sizes[sizeIdx]); }; // 안드로이드 볼륨 키 연결용
addEventListener('keydown', e => {
  if (e.key === 'AudioVolumeUp' || e.key === 'VolumeUp' || e.key === ']') { window.brushDelta(1); e.preventDefault(); }
  if (e.key === 'AudioVolumeDown' || e.key === 'VolumeDown' || e.key === '[') { window.brushDelta(-1); e.preventDefault(); }
  if (e.key === ' ') $('bPause').click();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') $('bUndo').click();
});
const SHAPES = ['Free', 'Line', 'Rect', 'Circle'], SHAPE_MSG = ['Draw freely', 'Drag to draw a line', 'Drag to fill a rectangle', 'Drag from the center to fill a circle'];
$('bShape').onclick = () => { shape = (shape + 1) % 4; $('bShape').textContent = SHAPES[shape]; $('bShape').classList.toggle('on', shape > 0); sendState(); toast(SHAPE_MSG[shape]); };
$('bUndo').onclick = () => send({ t: 'cmd', name: 'undo' });
const VIEWS = ['Normal', 'Air', 'Heat']; let view = 0;
$('bView').onclick = () => { view = (view + 1) % 3; $('bView').textContent = view ? VIEWS[view] + ' View' : 'View'; $('bView').classList.toggle('on', view > 0); send({ t: 'cmd', name: 'view', v: view }); if (view === 1) toast('Red: high pressure · Blue: low pressure · Green: wind'); if (view === 2) toast('Blue: cold · Red→Yellow→White: hot'); };
const GRAVS = [1, 0.4, 0]; let gi = 0;
$('bGrav').onclick = () => { gi = (gi + 1) % 3; $('bGrav').textContent = gi === 0 ? 'Gravity' : gi === 1 ? 'Low Grav' : 'Zero Grav'; $('bGrav').classList.toggle('on', gi > 0); send({ t: 'cmd', name: 'gravity', v: GRAVS[gi] }); };
const SPEEDS = [1, 2, 0.5]; let si = 0;
$('bSpeed').onclick = () => { si = (si + 1) % 3; $('bSpeed').textContent = 'Speed ' + SPEEDS[si] + '×'; $('bSpeed').classList.toggle('on', si > 0); send({ t: 'cmd', name: 'speed', v: SPEEDS[si] }); };
let paused = false;
$('bPause').onclick = () => { paused = !paused; $('bPause').textContent = paused ? 'Play' : 'Pause'; $('bPause').classList.toggle('on', paused); send({ t: 'cmd', name: 'pause', on: paused }); };
$('bStep').onclick = () => { if (!paused) $('bPause').click(); send({ t: 'cmd', name: 'step' }); };
$('bDemo').onclick = () => send({ t: 'cmd', name: 'demo' });
$('bClear').onclick = () => send({ t: 'cmd', name: 'clear' });
let mirrorOn = false;
$('bMirror').onclick = () => { mirrorOn = !mirrorOn; $('bMirror').classList.toggle('on', mirrorOn); send({ t: 'cmd', name: 'mirror', on: mirrorOn }); };
$('bGasX').onclick = () => send({ t: 'cmd', name: 'clearGas' });
$('bAirX').onclick = () => send({ t: 'cmd', name: 'resetAir' });
$('bTempX').onclick = () => send({ t: 'cmd', name: 'resetTemp' });
$('bSave').onclick = () => send({ t: 'cmd', name: 'save' });
$('bLoad').onclick = () => { let d = null; try { d = localStorage.getItem('physbox-save'); } catch (e) {} if (d) send({ t: 'cmd', name: 'load', data: d }); else toast('Nothing saved yet'); };

// ---- 터치 ----
function cellAt(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
let isDown = false;
cv.addEventListener('pointerdown', ev => { cv.setPointerCapture(ev.pointerId); isDown = true; const c = cellAt(ev); send({ t: 'down', x: c.x, y: c.y }); });
cv.addEventListener('pointermove', ev => { const c = cellAt(ev); send({ t: isDown ? 'move' : 'hover', x: c.x, y: c.y }); });
const up = () => { if (!isDown) return; isDown = false; send({ t: 'up' }); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// 모든 UI 준비가 끝난 뒤 시뮬레이션 시작
if (typeof OffscreenCanvas !== 'undefined' && cv.transferControlToOffscreen) startWorker(); else startMain();
})();
</script>
</body>
</html>
