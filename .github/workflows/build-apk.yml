name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 서명키를 계속 같은 걸로 써야 새 버전을 덮어서 설치할 수 있어요 (저장 데이터 유지)
      - name: Keep debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: physbox-debug-keystore-v1

      - name: Generate Android project
        run: |
          set -e
          PKG=com/windul2/physbox
          mkdir -p app/src/main/java/$PKG app/src/main/assets app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PhysBox"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.9.1' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.windul2.physbox'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.windul2.physbox'
                  minSdk 26
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv('VC') ?: '1')
                  versionName '1.' + (System.getenv('VC') ?: '1')
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Physics Sandbox"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="icon_bg">#0D0F13</color></resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#DEBE76" android:pathData="M30,74 L78,74 L66,58 L54,52 L42,58 Z" />
              <path android:fillColor="#2E6EFF" android:pathData="M30,74 L78,74 L78,80 L30,80 Z" />
              <path android:fillColor="#FF8A2A" android:pathData="M54,26 C62,36 66,42 62,50 C60,54 48,54 46,50 C42,42 48,36 54,26 Z" />
              <path android:fillColor="#FFE08A" android:pathData="M54,36 C58,42 59,45 57,48 C56,50 52,50 51,48 C49,45 51,42 54,36 Z" />
          </vector>
          EOF

          cat > app/src/main/java/$PKG/MainActivity.java <<'EOF'
          package com.windul2.physbox;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0D0F13);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  // 앱 안의 index.html을 https 주소처럼 열어서 워커(별도 스레드)·저장이 제대로 동작하게 함
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (!HOST.equals(u.getHost())) return null;
                          String p = u.getPath();
                          if (p == null || p.equals("/")) p = "/index.html";
                          try {
                              InputStream in = getAssets().open(p.substring(1));
                              String mime = p.endsWith(".html") ? "text/html" : p.endsWith(".js") ? "text/javascript" : "application/octet-stream";
                              return new WebResourceResponse(mime, "utf-8", in);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                  });
                  setContentView(web);
                  hideBars();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("https://" + HOST + "/index.html");
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              // 볼륨 키로 붓 크기 조절
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_UP) { web.evaluateJavascript("window.brushDelta && brushDelta(1)", null); return true; }
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) { web.evaluateJavascript("window.brushDelta && brushDelta(-1)", null); return true; }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override
              protected void onPause() { super.onPause(); web.onPause(); }
              @Override
              protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
          }
          EOF

      - name: Build APK
        env:
          VC: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "PhysBox-${{ github.run_number }}.apk"
          gh release create "v${{ github.run_number }}" "PhysBox-${{ github.run_number }}.apk" \
            --title "Physics Sandbox ${{ github.run_number }}" \
            --notes "Download the APK on your phone and install it."
